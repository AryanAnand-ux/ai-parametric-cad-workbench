name: CI — Full Stack Suite

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"

jobs:
  backend-test:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        env:
          ENVIRONMENT: test
          GEMINI_API_KEY: placeholder
          GROQ_API_KEY: placeholder
          SECRET_KEY: ci-test-secret-key-not-for-production
          ADMIN_TOKEN: ci-admin-token
        run: |
          python -m pytest \
            test_schemas.py \
            test_ast_security.py \
            test_llm_parser.py \
            test_geometry_validation.py \
            test_recompute_validation.py \
            test_auth_projects.py \
            test_universal_archetypes.py \
            test_pipeline.py \
            --tb=short -q

      - name: Generate test summary
        if: always()
        run: |
          echo "## CI Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Schema Validation | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| AST Security | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| LLM Parser | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Geometry Validation | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Recompute Contracts | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Auth & Projects | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Universal Archetypes | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline | ✅ |" >> $GITHUB_STEP_SUMMARY

  frontend-build:
    name: Frontend Build (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

